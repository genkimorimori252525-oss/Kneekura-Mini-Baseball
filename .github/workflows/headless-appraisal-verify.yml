name: Headless Source Appraisal Verification
on:
  push:
    branches: [jolly/confirmed-headless-appraisal-2026-09-22]
permissions:
  contents: read
concurrency:
  group: headless-appraisal-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: [self-hosted, Windows, X64, minibaseball]
    timeout-minutes: 15
    env:
      APPRAISAL_EVIDENCE: appraisal-evidence-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: source
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 26
      - name: Export exact feature source
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force "$env:APPRAISAL_EVIDENCE" | Out-Null
          git -C source archive --format=zip -o "$pwd/$env:APPRAISAL_EVIDENCE/changes.zip" HEAD src/core/world/psychology/appraisal docs/core/source-appraisal-v1-headless-api.md docs/project-status/2026-09-22-source-appraisal.md docs/superpowers/plans/2026-09-22-source-appraisal.md .github/workflows/headless-appraisal-verify.yml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git -C source rev-parse HEAD | Out-File -Encoding utf8 "$env:APPRAISAL_EVIDENCE/source-sha.txt"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install dependencies
        working-directory: source
        shell: cmd
        run: |
          call npm ci > ..\%APPRAISAL_EVIDENCE%\install.log 2>&1
          set "result=%ERRORLEVEL%"
          type ..\%APPRAISAL_EVIDENCE%\install.log
          exit /b %result%
      - name: Verify
        working-directory: source
        shell: cmd
        run: |
          call npm run verify > ..\%APPRAISAL_EVIDENCE%\verify.log 2>&1
          set "result=%ERRORLEVEL%"
          type ..\%APPRAISAL_EVIDENCE%\verify.log
          exit /b %result%
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: appraisal-evidence-${{ github.sha }}
          path: ${{ env.APPRAISAL_EVIDENCE }}/
          retention-days: 7
          if-no-files-found: error
