name: Headless Connected Action Adoption Verification
on:
  push:
    branches: [jolly/confirmed-headless-connected-action-adoption-2026-09-23]
permissions:
  contents: read
concurrency:
  group: connected-action-adoption-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: [self-hosted, Windows, X64, minibaseball]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 26
      - name: Export exact feature source
        shell: powershell
        run: |
          $dir = Join-Path $env:RUNNER_TEMP ("connected-action-" + $env:GITHUB_RUN_ID + "-" + $env:GITHUB_RUN_ATTEMPT)
          New-Item -ItemType Directory -Force $dir | Out-Null
          "EVIDENCE_DIR=$dir" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          git archive --format=zip -o "$dir/changes.zip" HEAD src/core/world/psychology/scheduling docs/core/connected-action-adoption-v1-headless-api.md docs/superpowers/plans/2026-09-23-connected-action-adoption.md docs/project-status/2026-09-23-connected-action-adoption.md .github/workflows/headless-connected-action-adoption-verify.yml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git rev-parse HEAD | Out-File -Encoding utf8 "$dir/source-sha.txt"
      - name: Install dependencies
        shell: cmd
        run: |
          call npm ci > "%EVIDENCE_DIR%\install.log" 2>&1
          set "result=%ERRORLEVEL%"
          type "%EVIDENCE_DIR%\install.log"
          exit /b %result%
      - name: Verify
        shell: cmd
        run: |
          call npm run verify > "%EVIDENCE_DIR%\verify.log" 2>&1
          set "result=%ERRORLEVEL%"
          type "%EVIDENCE_DIR%\verify.log"
          exit /b %result%
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: connected-action-evidence-${{ github.sha }}
          path: ${{ env.EVIDENCE_DIR }}/
          retention-days: 7
          if-no-files-found: error
