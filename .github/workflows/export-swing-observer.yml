name: Export Swing Observer HTML
on:
  push:
    branches:
      - jolly/export-swing-observer-html-2026-09-22
permissions:
  contents: read
jobs:
  export:
    runs-on: [self-hosted, Windows, X64, minibaseball]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: swing-kinematics-v1-core-observer
          path: docs/presentation/swing-kinematics-v1-core-observer.html
          if-no-files-found: error
          compression-level: 0