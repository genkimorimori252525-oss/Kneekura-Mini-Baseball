name: P0 Core

# GitHub-hosted minutes are blocked by the account's billing restriction, and this PC is the
# runner. Two deliberate choices here:
#   * there is no pull_request trigger, so nothing a pull request does can execute on this
#     machine - only pushes to the two jolly branches (your own work) run here;
#   * the routing label is repository-specific (minibaseball). A workflow that asks only for
#     "self-hosted, Windows, X64" cannot reach this runner.
on:
  workflow_dispatch:
  push:
    branches:
      - jolly/core-foundation-plan-2026-09-17
      - jolly/core-realism-2026-09-18
      - jolly/baseball-physics-realism-2026-09-20

permissions:
  contents: read

jobs:
  verify:
    runs-on: [self-hosted, Windows, X64, minibaseball]
    timeout-minutes: 30
    steps:
      # The shell is named explicitly: this machine has no PowerShell 7, and the default
      # shell for a Windows runner is pwsh.
      - uses: actions/checkout@v4
      # The runtime and @types/node must agree, because the types describe the runtime. The
      # development machine is node 26 and the types are @types/node 26, so the runtime here is
      # 26 too; while this was 22 the type checker accepted APIs that node 22 does not have.
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
      - name: Install dependencies
        shell: powershell
        # npm ci, not npm install: install resolves the tree again on every run, so the same
        # commit could be verified against different dependency versions on different days.
        # ci installs exactly what package-lock.json records and fails if the two disagree.
        run: npm ci
      - name: Verify
        shell: powershell
        run: npm run verify
